<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .card { padding: 22px 28px; display: flex; align-items: center; gap: 16px; }
  .box { background: var(--canvas-soft); border: 1px solid var(--hairline); width: 110px; height: 80px; display: flex; align-items: flex-end; padding: 8px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); }
</style></head><body>
<div class="card">
  <div class="box" style="border-radius:4px"><span class="lbl">xs · 4</span></div>
  <div class="box" style="border-radius:6px"><span class="lbl">sm · 6</span></div>
  <div class="box" style="border-radius:8px"><span class="lbl">md · 8 · btn</span></div>
  <div class="box" style="border-radius:12px"><span class="lbl">lg · 12 · card</span></div>
  <div class="box" style="border-radius:16px"><span class="lbl">xl · 16 · modal</span></div>
  <div class="box" style="border-radius:9999px;width:80px"><span class="lbl">full</span></div>
</div>
</body></html>
