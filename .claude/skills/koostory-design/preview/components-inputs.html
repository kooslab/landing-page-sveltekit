<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .card { padding: 22px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-family: var(--font-display); font-size: 14px; color: var(--ink); font-weight: 600; }
  input, select, textarea { font-family: var(--font-display); font-size: 16px; font-weight: 460; color: var(--ink); padding: 10px 12px; border-radius: 6px; border: 1px solid var(--hairline); background: var(--canvas); }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 2px; border-color: var(--primary); }
  input::placeholder { color: var(--ink-faint); }
</style></head><body>
<div class="card">
  <div class="field">
    <label>Work email</label>
    <input type="email" placeholder="you@company.de" value="lena@logistics.de"/>
  </div>
  <div class="field">
    <label>Team size</label>
    <select><option>6–10 people</option><option>10–25 people</option><option>25+ people</option></select>
  </div>
</div>
</body></html>
