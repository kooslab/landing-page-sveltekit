<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .card { padding: 22px 28px; display: flex; align-items: flex-end; gap: 10px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { background: var(--surface-violet-soft); border: 1px solid var(--primary); width: 28px; border-radius: var(--radius-xs); }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--ink); }
</style></head><body>
<div class="card">
  <div class="col"><div class="box" style="height:2px"></div><div class="tok">xxs</div><div class="px">2</div></div>
  <div class="col"><div class="box" style="height:4px"></div><div class="tok">xs</div><div class="px">4</div></div>
  <div class="col"><div class="box" style="height:8px"></div><div class="tok">sm</div><div class="px">8</div></div>
  <div class="col"><div class="box" style="height:12px"></div><div class="tok">md</div><div class="px">12</div></div>
  <div class="col"><div class="box" style="height:16px"></div><div class="tok">lg</div><div class="px">16</div></div>
  <div class="col"><div class="box" style="height:24px"></div><div class="tok">xl</div><div class="px">24</div></div>
  <div class="col"><div class="box" style="height:32px"></div><div class="tok">xxl</div><div class="px">32</div></div>
  <div class="col"><div class="box" style="height:64px"></div><div class="tok">huge</div><div class="px">64</div></div>
  <div class="col"><div class="box" style="height:96px"></div><div class="tok">mega</div><div class="px">96</div></div>
</div>
</body></html>
