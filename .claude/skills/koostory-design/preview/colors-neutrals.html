<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .card { padding: 18px 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .swatch { display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid var(--hairline); }
  .name { font-family: var(--font-display); font-size: 13px; color: var(--ink); font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); }
</style></head><body>
<div class="card">
  <div class="swatch"><div class="chip" style="background:#FFFFFF"></div><div class="name">Canvas</div><div class="hex">#FFFFFF</div></div>
  <div class="swatch"><div class="chip" style="background:#FAFAF8"></div><div class="name">Canvas Soft</div><div class="hex">#FAFAF8</div></div>
  <div class="swatch"><div class="chip" style="background:#E8E4DD"></div><div class="name">Hairline</div><div class="hex">#E8E4DD</div></div>
  <div class="swatch"><div class="chip" style="background:#3F3A52"></div><div class="name">Hairline Dark</div><div class="hex">#3F3A52</div></div>
  <div class="swatch"><div class="chip" style="background:#292827"></div><div class="name">Ink</div><div class="hex">#292827</div></div>
  <div class="swatch"><div class="chip" style="background:#73706D"></div><div class="name">Ink Mute</div><div class="hex">#73706D</div></div>
</div>
</body></html>
