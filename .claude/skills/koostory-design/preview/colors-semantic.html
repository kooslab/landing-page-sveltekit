<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .card { padding: 18px 22px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .row { display:flex; align-items:center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--hairline); font-family: var(--font-display); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .lbl { font-size: 13px; color: var(--ink); font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); margin-left: auto; }
</style></head><body>
<div class="card">
  <div class="row" style="background:#D1FAE5"><span class="dot" style="background:#10B981"></span><span class="lbl">Success</span><span class="hex">#10B981</span></div>
  <div class="row" style="background:#FEF3C7"><span class="dot" style="background:#F59E0B"></span><span class="lbl">Warning</span><span class="hex">#F59E0B</span></div>
  <div class="row" style="background:#FEE2E2"><span class="dot" style="background:#EF4444"></span><span class="lbl">Danger</span><span class="hex">#EF4444</span></div>
  <div class="row" style="background:#DBEAFE"><span class="dot" style="background:#3B82F6"></span><span class="lbl">Info</span><span class="hex">#3B82F6</span></div>
</div>
</body></html>
