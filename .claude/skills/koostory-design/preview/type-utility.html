<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .card { padding: 22px 28px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .btn-md { font-family: var(--font-display); font-size: 16px; font-weight: 700; padding: 12px 20px; border-radius: 8px; background: #1B1938; color: #fff; line-height: 1; }
  .btn-cap { font-family: var(--font-display); font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 8px; background: #FAFAF8; color: #292827; border: 1px solid #E8E4DD; line-height: 1; }
  .lead { font-family: var(--font-display); font-size: 18px; font-weight: 540; line-height: 1.5; letter-spacing: -0.135px; color: #292827; max-width: 44ch; }
  .strong { font-family: var(--font-display); font-size: 18.72px; font-weight: 700; line-height: 1.5; color: #292827; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); }
</style></head><body>
<div class="card">
  <div class="row">
    <span class="btn-md">button-md</span>
    <span class="btn-cap">button-cap</span>
    <span class="meta">16 · 700 · CTA</span>
    <span class="meta" style="margin-left: 12px">14 · 600 · compact</span>
  </div>
  <div class="lead">body-lg lead — 540 weight, the marketing intro voice that sits just under a display headline.</div>
  <div class="strong">body-strong — 18.72 · 700 for emphasized inline body.</div>
</div>
</body></html>
