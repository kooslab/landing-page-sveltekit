<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: #0E3030; }
  .card { padding: 40px 32px; display: flex; flex-direction: column; gap: 18px; color: #fff; font-family: var(--font-display); }
  .eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.5); }
  h2 { font-family: var(--font-display); font-size: 44px; font-weight: 540; line-height: 0.96; letter-spacing: -1.32px; margin: 0; max-width: 18ch; color: #fff; }
  p { font-size: 17px; font-weight: 540; line-height: 1.5; letter-spacing: -0.135px; color: rgba(255,255,255,0.72); max-width: 50ch; margin: 0; }
  .ctas { display: flex; gap: 10px; margin-top: 4px; }
  .btn { font-family: var(--font-display); font-size: 15px; font-weight: 700; padding: 11px 18px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .on-teal { background: #fff; color: #0E3030; border: none; }
  .ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
</style></head><body>
<div class="card">
  <span class="eyebrow">Scale or Fade.</span>
  <h2>Most teams in Europe will either learn to use AI or lose to teams that did.</h2>
  <p>We help with the first one.</p>
  <div class="ctas">
    <button class="btn on-teal">Book a 30-minute call</button>
    <button class="btn ghost">hi@koostory.de</button>
  </div>
</div>
</body></html>
