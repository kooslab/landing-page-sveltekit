<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: var(--canvas); padding: 20px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .ko-card { background: var(--canvas); border: 1px solid var(--hairline); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 10px; font-family: var(--font-display); }
  .ko-card.alt { background: var(--canvas-soft); }
  .ko-card.featured { background: #1B1938; color: #fff; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.10em; color: var(--ink-mute); font-weight: 600; }
  .ko-card.featured .eyebrow { color: rgba(255,255,255,0.6); }
  .ttl { font-size: 22px; line-height: 1.10; color: var(--ink); letter-spacing: -0.315px; font-weight: 460; }
  .ko-card.featured .ttl { color: #fff; }
  .body { font-size: 14px; line-height: 1.5; color: var(--ink-mute); }
  .ko-card.featured .body { color: rgba(255,255,255,0.72); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); }
  .ko-card.featured .meta { color: rgba(255,255,255,0.5); }
</style></head><body>
<div class="row">
  <div class="ko-card">
    <span class="eyebrow">Pricing</span>
    <div class="ttl">Workshop</div>
    <div class="body">Two-day hands-on for up to 12 people.</div>
    <div class="meta">From €4,800</div>
  </div>
  <div class="ko-card featured">
    <span class="eyebrow">Most chosen</span>
    <div class="ttl">Workshop + Build</div>
    <div class="body">Workshop plus a 4-week custom build engagement.</div>
    <div class="meta">From €18,000</div>
  </div>
  <div class="ko-card alt">
    <span class="eyebrow">Pricing</span>
    <div class="ttl">Build only</div>
    <div class="body">Custom internal tools for teams ready to ship.</div>
    <div class="meta">From €12,000</div>
  </div>
</div>
</body></html>
