<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .card { padding: 24px 32px; display: flex; flex-direction: column; gap: 6px; }
  .line { display: flex; align-items: baseline; gap: 16px; color: var(--ink); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); margin-left: auto; }
  .h1 { font-family: var(--font-display); font-size: 64px; font-weight: 540; line-height: 0.96; letter-spacing: -1.76px; }
  .h2 { font-family: var(--font-display); font-size: 48px; font-weight: 460; line-height: 0.96; letter-spacing: -1.32px; }
  .h3 { font-family: var(--font-display); font-size: 28px; font-weight: 540; line-height: 1.14; letter-spacing: -0.63px; }
</style></head><body>
<div class="card">
  <div class="line"><span class="h1">Scale or Fade.</span><span class="meta">64 · 540 · 0.96</span></div>
  <div class="line"><span class="h2">Two ways in.</span><span class="meta">48 · 460 · 0.96</span></div>
  <div class="line"><span class="h3">Get your team using AI by Friday.</span><span class="meta">28 · 540 · 1.14</span></div>
</div>
</body></html>
