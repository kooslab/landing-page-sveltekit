<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .card { padding: 22px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .badge { font-family: var(--font-display); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 9999px; display: inline-flex; align-items: center; gap: 6px; line-height: 1.4; border: 1px solid transparent; }
  .neutral { background: var(--canvas-soft); color: var(--ink); border-color: var(--hairline); }
  .violet { background: #C9B4FA; color: #1B1938; }
  .success { background: #D1FAE5; color: #066943; }
  .warning { background: #FEF3C7; color: #92400E; }
  .danger { background: #FEE2E2; color: #B91C1C; }
  .outline { background: transparent; color: var(--ink); border-color: var(--hairline-dark); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
</style></head><body>
<div class="card">
  <span class="badge neutral">Workshop</span>
  <span class="badge violet"><span class="dot"></span> Featured</span>
  <span class="badge success">Open</span>
  <span class="badge warning">3 spots left</span>
  <span class="badge danger">Sold out</span>
  <span class="badge outline">German + English</span>
</div>
</body></html>
