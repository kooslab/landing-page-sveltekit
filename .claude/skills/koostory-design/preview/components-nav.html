<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .card { padding: 0; display: flex; flex-direction: column; }
  .nav { display: flex; align-items: center; gap: 32px; padding: 20px 28px; font-family: var(--font-display); font-size: 15px; font-weight: 500; }
  .nav .right { margin-left: auto; display: flex; gap: 16px; align-items: center; }
  .dark { background: #1B1938; color: #fff; }
  .dark a { color: rgba(255,255,255,0.72); text-decoration: none; }
  .dark .brand { color: #fff; }
  .dark .brand .dot { color: #C9B4FA; }
  .dark .cta { background: #C9B4FA; color: #1B1938; padding: 10px 18px; border-radius: 9999px; font-weight: 700; }
  .light { background: #fff; color: #292827; }
  .light a { color: #292827; text-decoration: none; }
  .light .brand { color: #292827; }
  .light .brand .dot { color: #1B1938; }
  .light .cta { background: #1B1938; color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: 700; }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.03em; display: inline-flex; align-items: baseline; gap: 1px; }
</style></head><body>
<div class="card">
  <div class="nav dark">
    <span class="brand">KooStory<span class="dot">.</span></span>
    <a href="#">Workshops</a><a href="#">Build</a><a href="#">Case studies</a>
    <span class="right"><a href="#">EN · DE</a><a class="cta" href="#">Get started</a></span>
  </div>
  <div class="nav light">
    <span class="brand">KooStory<span class="dot">.</span></span>
    <a href="#">Workshops</a><a href="#">Build</a><a href="#">Case studies</a>
    <span class="right"><a href="#">EN · DE</a><a class="cta" href="#">Book a call</a></span>
  </div>
</div>
</body></html>
