<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KooStory — Scale or Fade.</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="site.css" />
</head>
<body data-screen-label="01 Marketing Site">
  <div id="root"></div>

  <script src="image-slot.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="WhatWeDo.jsx"></script>
  <script type="text/babel" src="Workshops.jsx"></script>
  <script type="text/babel" src="CaseStudies.jsx"></script>
  <script type="text/babel" src="Quote.jsx"></script>
  <script type="text/babel" src="Manifesto.jsx"></script>
  <script type="text/babel" src="ClosingCTA.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="BookingModal.jsx"></script>

  <script type="text/babel">
    function App() {
      const [booking, setBooking] = React.useState(false);
      const openBook = React.useCallback(() => setBooking(true), []);
      const closeBook = React.useCallback(() => setBooking(false), []);
      // sticky-nav scroll shadow
      React.useEffect(() => {
        const onScroll = () => {
          const nav = document.querySelector('.ks-nav');
          if (!nav) return;
          nav.classList.toggle('is-scrolled', window.scrollY > 4);
        };
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <>
          <Nav onBook={openBook} />
          <main>
            <Hero onBook={openBook} />
            <WhatWeDo />
            <Workshops onBook={openBook} />
            <CaseStudies />
            <Quote />
            <Manifesto />
            <ClosingCTA onBook={openBook} />
          </main>
          <Footer />
          <BookingModal open={booking} onClose={closeBook} />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
